<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>계약가이드 관리자</title>
  <link rel="stylesheet" href="style.css">
  <style>
    table { border-collapse: collapse; width: 100%; font-size: 13px; }
    th, td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
    th { background: #eef2f8; }
    .none { background: #fff5e0; }
  </style>
</head>
<body>
  <header class="top"><div class="wrap"><h1>관리자 <span class="tag">내부용</span></h1><p>사용 통계, 질문 기록, 피드백을 확인합니다. 근거를 찾지 못한 질문은 FAQ 후보입니다.</p></div></header>
  <main class="wrap" style="padding-top:18px">
    <div class="panel"><h2>사용 통계</h2><div id="stats">불러오는 중...</div></div>
    <div class="panel"><h2>최근 질문 <span class="small muted">(주황색 = 근거를 찾지 못함, FAQ 추가 후보)</span></h2><div id="questions"></div></div>
    <div class="panel"><h2>피드백</h2><div id="feedback"></div></div>
    <p><a href="index.html">서비스 화면으로</a></p>
  </main>
  <script>
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const NAMES = { guide: '계약가이드 조회', chat_button: '질문 버튼(저장 답변)', chat_faq: 'FAQ 키워드 답변', chat_cache: '캐시 답변', chat_article: '조문 검색 답변', chat_interp: '유권해석 답변',  chat_none: '근거 없음(답변 못함)', feedback_up: '도움이 됨', feedback_down: '도움이 안 됨', feedback_comment: '의견 접수' };
    const key = new URLSearchParams(location.search).get('key') || '';
    fetch('/api/admin?key=' + encodeURIComponent(key)).then(r => r.json()).then(d => {
      if (d.error) { document.getElementById('stats').textContent = d.error; return; }
      const s = d.stats;
      const chat = (s.chat_button || 0) + (s.chat_faq || 0) + (s.chat_cache || 0) + (s.chat_article || 0) + (s.chat_interp || 0) + (s.chat_none || 0);
      document.getElementById('stats').innerHTML = `<p>전체 질문 ${chat}건 (AI 호출 0건 - 아직 연계 전)</p><table><tr><th>항목</th><th>횟수</th></tr>${Object.entries(s).map(([k, v]) => `<tr><td>${esc(NAMES[k] || k)}</td><td>${v}</td></tr>`).join('')}</table>`;
      document.getElementById('questions').innerHTML = d.questions.length ? `<table><tr><th>시각</th><th>질문</th><th>처리</th><th>기관</th></tr>${d.questions.map(q => `<tr class="${q.type === 'none' ? 'none' : ''}"><td>${esc(q.at.replace('T', ' ').slice(0, 19))}</td><td>${esc(q.q)}</td><td>${esc(NAMES['chat_' + q.type] || q.type)}</td><td>${esc(q.org || '-')}</td></tr>`).join('')}</table>` : '<p class="muted">아직 질문이 없습니다.</p>';
      document.getElementById('feedback').innerHTML = d.feedback.length ? `<table><tr><th>시각</th><th>종류</th><th>평가</th><th>내용/질문</th></tr>${d.feedback.map(f => `<tr><td>${esc(f.at.replace('T', ' ').slice(0, 19))}</td><td>${f.kind === 'answer' ? '답변 평가' : '의견'}</td><td>${f.rating === 'up' ? '도움됨' : f.rating === 'down' ? '도움 안 됨' : '-'}</td><td>${esc(f.comment || f.question || '')}</td></tr>`).join('')}</table>` : '<p class="muted">아직 피드백이 없습니다.</p>';
    });
  </script>
</body>
</html>
